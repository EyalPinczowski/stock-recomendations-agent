# The single "risk profile" dial: target allocation mix, minimum reward:risk to
# act on, position sizing cap, sector concentration cap, and how much drift
# triggers a rebalance suggestion.
name: balanced
target_conservative_pct: 0.6
target_aggressive_pct: 0.4
min_reward_risk_ratio: 1.5
max_position_pct: 0.15
max_sector_pct: 0.25
rebalance_drift_threshold_pct: 0.05

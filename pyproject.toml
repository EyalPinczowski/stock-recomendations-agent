[project]
name = "portfolio-agent"
version = "0.1.0"
description = "On-demand portfolio analysis, rebalancing, and short-term screening agent, delivered as PowerPoint decks over Telegram."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "python-pptx>=1.0",
    # Not optional in practice: Android/Termux has no IANA time-zone database
    # that Python can read, and yfinance needs one for every quote. pandas only
    # declares tzdata on Windows, so nothing else pulls it in there.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Both of these are optional because they're the hardest things to install on
# constrained hosts (Termux/Android), and the code degrades without them:
#   charts -> deck renders allocation tables instead of charts
#   llm    -> only needed for LLM_PROVIDER=anthropic. The default Gemini backend
#             talks REST over `requests` and needs nothing extra installed.
# `anthropic` is an extra rather than a core dep because it pulls in `jiter`,
# which needs a Rust toolchain to build where no wheel is published.
charts = ["matplotlib>=3.8"]
llm = ["anthropic>=0.34"]
dev = ["pytest>=8.0", "pytest-mock", "ruff", "mypy"]

[project.scripts]
portfolio-agent = "portfolio_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["portfolio_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
